# reBotArm RS 机械臂配置文件 —— 灵足（RobStride）电机 + CAN 总线
# 参数参考 reBotArm_control_py 的 config/rebotarm_rs.yaml。
#
# 灵足电机说明:
#   - 通信方式为 CAN 总线（如 can0），不是串口桥。
#     运行前用 `ip link show can0` 确认 CAN 接口已配置并 up：
#       sudo ip link set can0 up type can bitrate 1000000
#   - feedback_id 为主机 ID（host id），灵足默认 0xFD。
#   - MIT 增益直接编码在控制帧内；POS_VEL 增益写入电机参数表：
#       0x7017 limit_spd（vlim）、0x701F spd_kp（vel_kp）、
#       0x7020 spd_ki（vel_ki）、0x701E loc_kp（pos_kp）。
#     灵足无独立位置环 Ki，pos_ki 字段被忽略。

channel: can0

# 控制循环频率 (Hz)
rate: 500

joints:
  # joint1:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0xFD
    model: "rs-06"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 3.0
    POS_VEL:
      vel_kp: 12.0
      vel_ki: 0.1
      pos_kp: 13.0
      vlim: 10.0

